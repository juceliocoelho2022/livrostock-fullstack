services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: livrostock
      POSTGRES_USER: livrostock
      POSTGRES_PASSWORD: livrostock
    ports:
      - "5432:5432"
    volumes:
      - livrostock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livrostock -d livrostock"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  livrostock_pgdata:
