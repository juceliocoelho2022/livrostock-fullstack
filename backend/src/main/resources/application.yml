spring:
  application:
    name: livrostock-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/livrostock}
    username: ${DB_USER:livrostock}
    password: ${DB_PASSWORD:livrostock}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
livrostock:
  storage:
    pdf-dir: ${PDF_STORAGE_DIR:./data/pdfs}
server:
  port: ${PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: livrostock-api
springdoc:
  swagger-ui:
    path: /swagger-ui.html
