name: CI
on:
  push:
    branches: [main, develop, feature/v0.2-categorias]
  pull_request:
    branches: [main, develop, 'feature/v0.3-pdf-security']
permissions:
  contents: read
jobs:
  backend:
    name: Java 21 - Maven tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test backend
        run: mvn -B --no-transfer-progress clean test
  frontend:
    name: React - TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
